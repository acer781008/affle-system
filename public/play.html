<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="stylesheet" href="style.css">
<title>歡樂抽獎</title>
</head>
<body class="player-body">
<div class="player-shell">
  <section id="joinCard" class="player-entry-card">
    <div class="entry-spark s1">✦</div><div class="entry-spark s2">✦</div><div class="entry-spark s3">★</div>
    <div id="entryArt" class="entry-art"></div>
    <div class="entry-badge">🎉 歡樂抽獎</div>
    <h1 id="joinTitle">準備抽獎囉！</h1>
    <p id="entryMode" class="entry-mode">載入抽獎中…</p>
    <div id="entryNote" class="entry-note" style="display:none"></div>
    <div id="entrySchedule" class="player-schedule-card" hidden>
      <div class="schedule-title">⏳ 尚未開放抽獎</div>
      <div id="entryStartAt" class="schedule-start-at"></div>
      <div id="entryCountdown" class="schedule-countdown">--:--:--</div>
      <div class="schedule-sub">時間到會自動開放，不用重新整理。</div>
    </div>
    <div class="join-panel">
      <label for="nameInput">你的遊戲名</label>
      <input id="nameInput" class="input player-name-input" maxlength="30" autocomplete="off" placeholder="請輸入遊戲名">
      <button id="joinBtn" class="btn player-start">✨ 開始抽獎</button>
      <div id="msg" class="player-msg"></div>
    </div>
    <div class="entry-rule">每人限抽一次・選一個你喜歡的圖案試試手氣 🍀</div>
  </section>

  <section id="game" style="display:none">
    <div class="player-game-head">
      <div class="mini-brand">🎪 歡樂抽獎</div>
      <div id="roomTag" class="room-chip"></div>
    </div>
    <div class="player-title-card">
      <h1 id="gameTitle"></h1>
      <div id="noteBox" class="note player-note" style="display:none"></div>
      <div id="gameSchedule" class="player-schedule-card game-schedule" hidden>
        <div class="schedule-title">⏳ 尚未開放抽獎</div>
        <div id="gameStartAt" class="schedule-start-at"></div>
        <div id="gameCountdown" class="schedule-countdown">--:--:--</div>
        <div class="schedule-sub">時間到會自動開放抽獎。</div>
      </div>
      <div id="hint" class="player-hint"></div>
      <div class="player-board-tools">
        <button id="copyPlayerBoardBtn" class="btn player-copy-board" type="button" onclick="copyPlayerBoardImage()">🖼️ 複製整盤抽獎畫面</button>
      </div>
    </div>
    <div id="area"></div>
    <div id="result"></div>
  </section>
</div>

<div id="resultModal" class="result-modal" hidden aria-hidden="true">
  <div class="result-modal-backdrop" data-close-result></div>
  <section class="result-modal-card" role="dialog" aria-modal="true" aria-labelledby="resultModalTitle">
    <button type="button" class="result-modal-x" aria-label="關閉結果" onclick="closeResultModal()">×</button>
    <div id="resultModalContent"></div>
    <button type="button" class="btn primary result-modal-close" onclick="closeResultModal()">確定</button>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search),roomId=(qs.get('room')||'').toUpperCase(),socket=io();
let room=null,player='',spinning=false,hasDrawn=false,audioCtx=null,popAudioBuffer=null,lastResult=null,serverOffsetMs=0,scheduleWasPending=false,scheduleTimer=null,rainPlayer=null;
const rainState={playing:false,qualified:false,drawing:false,requesting:false,starting:false,timeLeft:0,hits:0,score:0,playId:'',packetLimit:1,spawnTimer:null,clockTimer:null};
const DEVICE_KEY='raffleDeviceId';
let deviceId=localStorage.getItem(DEVICE_KEY);
if(!deviceId){deviceId=(crypto?.randomUUID?.()||('dev-'+Date.now()+'-'+Math.random().toString(36).slice(2)));localStorage.setItem(DEVICE_KEY,deviceId);}
$('roomTag').textContent=roomId?'抽獎 '+roomId:'';
if(!roomId){$('msg').textContent='這個玩家網址缺少抽獎代碼，請重新向主控索取網址。';$('joinBtn').disabled=true;}else{socket.emit('room:join',roomId);loadRoom();}

function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function isLoseResult(x){return !!(x&&(x.isLose||/^(再接再厲|未中獎|沒中獎|謝謝惠顧|銘謝惠顧)$/u.test(String(x.prize||'').trim())));}
function assetFor(i=0){
  if(!room)return '/assets/balloon-round.png';
  if(room.mode==='balloon')return `/assets/balloon-${room.balloonShape||'round'}.png`;
  return `/assets/egg-${room.eggStyle==='gold'?'gold':'color'}-${String((i%(room.eggStyle==='gold'?8:16))+1).padStart(2,'0')}.png`;
}
function playerBoardCols(){return [5,7,8].includes(+room?.boardCols)?+room.boardCols:5;}
function syncServerClock(r){if(r?.serverNow){const t=Date.parse(r.serverNow);if(Number.isFinite(t))serverOffsetMs=t-Date.now();}}
function serverNowMs(){return Date.now()+serverOffsetMs;}
function hasSchedule(){return !!(room?.useScheduledStart&&room?.startAt&&Number.isFinite(Date.parse(room.startAt)));}
function beforeScheduledStart(){return hasSchedule()&&serverNowMs()<Date.parse(room.startAt);}
function formatStartAt(){if(!hasSchedule())return '';return new Date(room.startAt).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});}
function countdownText(){if(!beforeScheduledStart())return '00:00:00';let sec=Math.max(0,Math.ceil((Date.parse(room.startAt)-serverNowMs())/1000)),days=Math.floor(sec/86400);sec%=86400;const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60,p=n=>String(n).padStart(2,'0');return days>0?`${days}天 ${p(h)}:${p(m)}:${p(s)}`:`${p(h)}:${p(m)}:${p(s)}`;}
function updateScheduleUI(){
  if(!room)return;const pending=beforeScheduledStart(),show=hasSchedule()&&pending;
  for(const id of ['entrySchedule','gameSchedule'])$(id).hidden=!show;
  if(hasSchedule()){const at=`開賽時間：${formatStartAt()}`;$('entryStartAt').textContent=at;$('gameStartAt').textContent=at;}
  if(show){const cd=countdownText();$('entryCountdown').textContent=cd;$('gameCountdown').textContent=cd;}
  if(scheduleWasPending&&!pending){scheduleWasPending=false;if(player)render();else renderEntryArt();}else scheduleWasPending=pending;
}
function startScheduleTicker(){if(scheduleTimer)clearInterval(scheduleTimer);scheduleTimer=setInterval(updateScheduleUI,500);updateScheduleUI();}
function rainModeLabel(){
  const m=room?.rain?.subMode||'A';
  return m==='A'?'A｜集滿型':m==='B'?'B｜單包開獎':'C｜分數累積型';
}
function renderEntryArt(){
  if(!room)return;
  if(room.mode==='rain'){
    $('entryArt').innerHTML='<div class="entry-redpacket er1">福</div><div class="entry-redpacket er2">福</div><div class="entry-redpacket er3">福</div>';
    $('entryMode').textContent=`🧧 紅包雨｜${rainModeLabel()}`;
    const r=room.rain||{},mc=r[r.subMode]||{};
    document.querySelector('.entry-rule').textContent=r.subMode==='A'?`限時搶滿 ${mc.targetPackets||20} 包，達標後按「立即抽獎」 🍀`:r.subMode==='B'?'點一個紅包就直接開獎 🍀':`限時累積 ${mc.targetScore||50} 分，達標後按「立即抽獎」 🍀`;
  }else{
    const srcs=room.mode==='balloon'?[assetFor(0),assetFor(0),assetFor(0)]:[assetFor(0),assetFor(1),assetFor(2)];
    $('entryArt').innerHTML=srcs.map((s,i)=>`<img class="entry-object e${i+1} ${room.mode==='balloon'&&room.balloonFloat?'entry-float':''}" src="${s}" alt="">`).join('');
    $('entryMode').textContent=room.mode==='balloon'?'🎈 戳氣球｜挑一顆你最有感覺的氣球':'🥚 砸金蛋｜挑一顆幸運金蛋';
    document.querySelector('.entry-rule').textContent=room.limitOnePerPlayer!==false?'每人限抽一次・重新整理也不能再抽 🍀':'本場允許重複抽獎・選一個你喜歡的圖案試試手氣 🍀';
  }
  $('joinBtn').textContent=beforeScheduledStart()?'⏳ 進入等待':room.mode==='rain'?'🧧 進入紅包雨':'✨ 開始抽獎';
  $('entryNote').style.display=room.note?'block':'none';$('entryNote').textContent=room.note||'';updateScheduleUI();
}
async function loadRoom(){
  try{const resp=await fetch('/api/rooms/'+encodeURIComponent(roomId)),j=await resp.json();if(!j.ok){$('msg').textContent='找不到這場抽獎，可能已刪除或伺服器剛重啟。';$('joinBtn').disabled=true;return;}room=j.room;syncServerClock(room);$('joinTitle').textContent=room.title||'歡樂抽獎活動';renderEntryArt();startScheduleTicker();}
  catch(e){$('msg').textContent='目前無法連線到抽獎系統，請重新整理再試。';}
}
socket.on('room:update',r=>{
  room=r;syncServerClock(room);
  if(!player){$('joinTitle').textContent=room.title;renderEntryArt();}
  else if(room.mode==='rain'&&(rainState.playing||rainState.qualified||rainState.drawing||rainState.requesting)){updateRainHud();}
  else if(!spinning)render();
  updateScheduleUI();
});
socket.on('room:deleted',()=>{alert('這場抽獎已被主控刪除');location.reload();});
$('joinBtn').addEventListener('click',join);$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')join();});
async function join(){
  if(!room){$('msg').textContent='抽獎尚未載入完成，請重新整理頁面。';return;}
  player=$('nameInput').value.trim();if(!player){$('msg').textContent='請先輸入遊戲名';return;}
  try{
    const j=await fetch('/api/rooms/'+roomId+'/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:player,deviceId})}).then(r=>r.json());
    if(!j.ok){$('msg').textContent=j.message||'無法進入抽獎';return;}
    room=j.room;rainPlayer=j.rainPlayer||null;syncServerClock(room);$('joinCard').style.display='none';$('game').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){$('msg').textContent='連線失敗，請重新整理再試。';}
}
function render(){
  if(!room)return;document.body.classList.toggle('rain-active',room.mode==='rain');$('gameTitle').textContent=room.title;$('noteBox').style.display=room.note?'block':'none';$('noteBox').textContent=room.note||'';updateScheduleUI();
  $('copyPlayerBoardBtn').style.display=room.mode==='rain'?'none':'inline-flex';
  if(room.mode==='rain')renderRainHome();else renderGrid();
}
function renderGrid(){
  const cols=playerBoardCols();
  if(beforeScheduledStart()){$('hint').textContent='⏳ 尚未開放，倒數結束後會自動顯示抽獎盤。';$('area').innerHTML='<div class="schedule-waiting-board">🎈🥚<b>抽獎即將開始</b><span>可以留在這個頁面等待，不用重新整理。</span></div>';return;}
  $('hint').textContent=room.mode==='balloon'?'🎈 點一顆還沒被戳過的氣球':'🥚 點一顆還沒被砸過的金蛋';
  const used=new Map(room.results.map(x=>[x.slot,x]));
  $('area').innerHTML='<div class="player-board-card"><div class="board clean-board mobile-board user-sized-board cols-'+cols+'" style="--board-cols:'+cols+'">'+Array.from({length:room.count},(_,i)=>{
    const n=i+1,x=used.get(n),asset=assetFor(i),imgClass=`raffle-art ${room.mode==='egg'?'egg-art':''} ${room.mode==='balloon'&&room.balloonFloat&&!x?'float-art':''}`;
    const opened=x?'<div class="opened-mark">✓ 已抽</div>':'';
    return `<button class="tile clean-tile ${x?'used':''}" ${x||(room.limitOnePerPlayer!==false&&hasDrawn)?'disabled':''} aria-label="抽獎物件 ${n}" onclick="draw(${n})"><div class="object-card"><div class="art-wrap"><img class="${imgClass}" style="--delay:-${(i%11)*.13}s;--dur:${1.9+(i%8)*.19}s;--drift:${8+(i%5)*2}px" src="${asset}" alt=""></div>${opened}</div></button>`;
  }).join('')+'</div></div>';
}
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function popSound(){try{const c=ctx();if(!popAudioBuffer){const len=Math.floor(c.sampleRate*.10),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);popAudioBuffer=b;}const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='highpass';f.frequency.value=480;s.buffer=popAudioBuffer;s.connect(f);f.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.20,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.10);s.start();}catch(e){}}
function crackSound(){try{const c=ctx();[0,.055,.105].forEach((t,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.setValueAtTime(520-i*90,c.currentTime+t);o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.16,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.06);o.start(c.currentTime+t);o.stop(c.currentTime+t+.07);});}catch(e){}}
function winSound(){if(room?.mode==='rain'&&room.rain?.sound===false)return;try{const c=ctx();[659,784,988,1319].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.11;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.3);});}catch(e){}}
function loseSound(){if(room?.mode==='rain'&&room.rain?.sound===false)return;try{const c=ctx();[392,330,262].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.13;o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24);});}catch(e){}}

function loadBoardImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src;});}
async function copyPlayerBoardImage(){
  if(!room||room.mode==='rain')return;
  const btn=$('copyPlayerBoardBtn'),oldText=btn.textContent;btn.disabled=true;btn.textContent='⏳ 產生整盤中…';
  let c=null,blob=null;
  try{
    const cols=playerBoardCols(),cellW=cols>=8?116:(cols>=7?124:145),cellH=cellW,gap=cols>=8?6:8,pad=24,header=122,rows=Math.ceil(room.count/cols);
    c=document.createElement('canvas');const g=c.getContext('2d');c.width=pad*2+cols*cellW+(cols-1)*gap;c.height=header+rows*cellH+(rows-1)*gap+pad;
    const bg=g.createLinearGradient(0,0,c.width,c.height);bg.addColorStop(0,'#fff5fb');bg.addColorStop(1,'#eef5ff');g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);
    g.textAlign='center';g.fillStyle='#4b3b74';g.font='900 34px Segoe UI,Arial';g.fillText(room.title||'歡樂抽獎',c.width/2,43);g.font='800 19px Segoe UI,Arial';g.fillStyle='#735e9e';g.fillText(room.mode==='balloon'?'🎈 戳氣球':'🥚 砸金蛋',c.width/2,75);g.font='700 15px Segoe UI,Arial';g.fillStyle='#8a7da0';g.fillText(`已抽 ${room.results.length} / ${room.count}`,c.width/2,101);
    const used=new Map(room.results.map(x=>[x.slot,x])),cache=new Map();
    async function getAsset(i){const src=assetFor(i);if(!cache.has(src))cache.set(src,await loadBoardImage(src));return cache.get(src);}
    for(let i=0;i<room.count;i++){const col=i%cols,row=Math.floor(i/cols),x=pad+col*(cellW+gap),y=header+row*(cellH+gap),res=used.get(i+1),im=await getAsset(i),artMax=Math.max(28,cellW-18),iw=room.mode==='egg'?Math.min(artMax*.82,94):Math.min(artMax,108),ih=room.mode==='egg'?Math.min(artMax,108):iw;g.save();g.globalAlpha=res?.28:1;g.drawImage(im,x+(cellW-iw)/2,y+6,iw,ih);g.restore();}
    blob=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);btn.textContent='✅ 整盤已複製';
  }catch(e){if(c){const a=document.createElement('a');a.download=(room.title||'抽獎整盤')+'.png';a.href=c.toDataURL('image/png');a.click();btn.textContent='📱 已改存成圖片';}}
  finally{setTimeout(()=>{btn.disabled=false;btn.textContent=oldText;},2300);}
}

function showResultModal(result){
  if(!result)return;lastResult=result;const lose=isLoseResult(result),modal=$('resultModal'),content=$('resultModalContent');
  content.innerHTML=lose?`<div class="modal-result lose"><div class="modal-kicker">這次沒有中獎</div><img class="modal-lose-stamp" src="/assets/lose-stamp.svg?v=120" alt="再接再厲"><h2 id="resultModalTitle">再接再厲 ✨</h2><p>${escapeHtml(player)}</p></div>`:`<div class="modal-result win"><div class="modal-confetti">🎉 ✨ 🎁 ✨ 🎉</div><div class="modal-kicker">恭喜中獎</div><h2 id="resultModalTitle">${escapeHtml(result.prize)}</h2><p>${escapeHtml(player)}</p></div>`;
  modal.hidden=false;modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');
}
function closeResultModal(){const modal=$('resultModal');modal.hidden=true;modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');}
$('resultModal').addEventListener('click',e=>{if(e.target&&e.target.hasAttribute('data-close-result'))closeResultModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('resultModal').hidden)closeResultModal();});

async function draw(slot){
  if(beforeScheduledStart()){updateScheduleUI();return;}
  if(spinning||hasDrawn)return;spinning=true;room.mode==='balloon'?popSound():crackSound();
  try{
    const j=await fetch('/api/rooms/'+roomId+'/draw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player,slot,deviceId})}).then(r=>r.json());
    setTimeout(()=>{spinning=false;if(!j.ok){alert(j.message||'抽獎失敗');return;}hasDrawn=j.room.limitOnePerPlayer!==false;room=j.room;lastResult=j.result;if(isLoseResult(j.result))loseSound();else winSound();render();$('result').innerHTML='<button type="button" class="btn player-view-result" onclick="showResultModal(lastResult)">🎁 查看我的抽獎結果</button>';showResultModal(j.result);},180);
  }catch(e){spinning=false;alert('連線失敗，請再試一次');}
}

/* ==================== 紅包雨 A / B / C ==================== */
function rainCfg(){return room?.rain||{subMode:'A',speed:'fast',density:'high',sound:true,maxWins:1,A:{duration:30,targetPackets:20,maxPlays:3},B:{duration:20,packetLimit:1,maxPlays:1},C:{duration:30,targetScore:50,difficulty:'normal',maxPlays:3}};}
function rainModeCfg(){const r=rainCfg();return r[r.subMode]||r.A;}
function renderRainHome(message=''){removeRainQualifiedOverlay();
  stopRainAll(false);rainState.qualified=false;rainState.drawing=false;rainState.requesting=false;
  if(beforeScheduledStart()){$('hint').textContent='⏳ 尚未開放紅包雨';$('area').innerHTML='<div class="schedule-waiting-board">🧧<b>紅包雨即將開始</b><span>倒數結束會自動開放，不用重新整理。</span></div>';return;}
  const r=rainCfg(),sub=r.subMode,mc=rainModeCfg(),plays=rainPlayer?.plays||0,wins=rainPlayer?.wins||0,canDraw=wins<r.maxWins;
  $('hint').textContent=`🧧 紅包雨 ${rainModeLabel()}`;
  const rule=sub==='A'
    ?`${mc.duration} 秒內搶滿 <b>${mc.targetPackets}</b> 包，${canDraw?'達標後按「立即抽獎」。':'達標即完成挑戰；本場開獎次數已用完。'}`
    :sub==='B'
      ?`${canDraw?'點到紅包就直接開獎':'點到紅包即完成挑戰；本場開獎次數已用完'}；本局可搶 <b>${mc.packetLimit}</b> 包。`
      :`${mc.duration} 秒內累積到 <b>${mc.targetScore}</b> 分；最低 0 分。${canDraw?'達標後可立即抽獎。':'達標即完成挑戰；本場開獎次數已用完。'}<div class="rain-score-legend"><span class="legend-red">🔴 紅色＝一般加分</span><span class="legend-gold">🟡 金色＝高分加分</span><span class="legend-purple">🟣 紫色＝扣分</span><span class="legend-bomb">💣 炸彈＝分數歸零</span></div><div class="rain-score-note">加／扣分與炸彈出現機率會依難度由系統自動分配；分數最低維持 0。</div>`;
  $('area').innerHTML=`<div class="rain-start-card">
    <div class="rain-start-hero"><div class="rain-mascot-packet">福</div><div><div class="rain-small-title">🧧 紅包雨</div><h2>${rainModeLabel()}</h2></div></div>
    <div class="rain-rule-box">${rule}</div>
    <div class="rain-player-stats"><span>已玩 <b>${plays}/${mc.maxPlays}</b></span><span>已開獎 <b>${wins}/${r.maxWins}</b></span></div>
    ${message?`<div class="rain-home-message">${escapeHtml(message)}</div>`:''}
    <button id="rainStartBtn" class="btn primary rain-start-button" onclick="startRainGame()">▶ 開始挑戰</button>
  </div>`;
}
async function startRainGame(){
  if(beforeScheduledStart())return updateScheduleUI();
  if(rainState.starting)return;
  rainState.starting=true;
  const startBtn=$('rainStartBtn');
  if(startBtn){startBtn.disabled=true;startBtn.textContent='⏳ 準備中…';}
  try{
    const j=await fetch('/api/rooms/'+roomId+'/rain/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player,deviceId})}).then(r=>r.json());
    if(!j.ok){rainState.starting=false;return renderRainHome(j.message||'無法開始');}
    room=j.room;rainPlayer=j.player;rainState.playId=j.playId;rainState.packetLimit=j.packetLimit||1;rainState.timeLeft=rainModeCfg().duration;rainState.hits=0;rainState.score=0;rainState.playing=false;rainState.qualified=false;rainState.drawing=false;rainState.requesting=false;
    removeRainQualifiedOverlay();
    buildRainArena();
    let n=3;const center=$('rainCenter');center.innerHTML='<b>3</b><span>準備！</span>';
    const cd=setInterval(async()=>{
      n--;
      if(n>0){if(center)center.innerHTML=`<b>${n}</b><span>準備！</span>`;return;}
      clearInterval(cd);
      try{
        const c=await fetch('/api/rooms/'+roomId+'/rain/confirm-start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player,deviceId,playId:rainState.playId})}).then(r=>r.json());
        if(!c.ok){rainState.starting=false;return renderRainHome(c.message||'無法開始這一局');}
        room=c.room;rainPlayer=c.player;
        if(center)center.innerHTML='<b>GO!</b><span>快搶紅包！</span>';
        setTimeout(()=>{if($('rainCenter'))$('rainCenter').classList.add('fade')},380);
        rainState.starting=false;
        beginRain();
      }catch(e){
        rainState.starting=false;
        renderRainHome('連線中斷，本局沒有扣次數，請再試一次');
      }
    },620);
  }catch(e){
    rainState.starting=false;
    renderRainHome('連線失敗，本局沒有扣次數，請再試一次');
  }
}
function buildRainArena(){
  const r=rainCfg(),sub=r.subMode;
  const canDraw=(rainPlayer?.wins||0)<r.maxWins;
  $('hint').textContent=canDraw?(sub==='A'?'🎯 搶滿紅包就能抽獎':sub==='B'?'🧧 點到紅包直接開獎':'🎯 累積到目標分數就能抽獎'):'🎮 本場開獎次數已用完，本局仍可完成挑戰';
  $('area').innerHTML=`<div class="rain-game-wrap">
    <div class="rain-hud">
      <div><span>剩餘時間</span><b id="rainTime">${rainState.timeLeft}</b></div>
      <div><span>模式</span><b>${sub}</b></div>
      <div><span>${sub==='C'?'目前分數':'已搶紅包'}</span><b id="rainMainValue">0</b></div>
    </div>
    <div id="rainArena" class="rain-arena">
      <div class="rain-cloud rc1"></div><div class="rain-cloud rc2"></div>
      <div id="rainCenter" class="rain-center"><b>3</b><span>準備！</span></div>
    </div>
    ${sub==='B'?'':`<div class="rain-progress-box"><div class="rain-progress-row"><span id="rainProgressText"></span><b id="rainPercent">0%</b></div><div class="rain-progress-track"><i id="rainProgressBar"></i></div></div>`}
  </div>`;
  const arena=$('rainArena');
  if(arena)arena.addEventListener('pointerdown',e=>{
    const b=e.target.closest?.('.falling-redpacket');
    if(!b||!arena.contains(b))return;
    const raw=b.dataset.score,score=raw===''?null:Number(raw);
    tapRainPacket(e,b,score);
  },{passive:false});
  updateRainHud();
}
function updateRainHud(){
  if(!$('rainTime'))return;const r=rainCfg(),sub=r.subMode,mc=rainModeCfg();
  $('rainTime').textContent=Math.max(0,rainState.timeLeft);
  $('rainMainValue').textContent=sub==='C'?rainState.score:rainState.hits;
  if(sub!=='B'&&$('rainProgressText')){
    const cur=sub==='A'?rainState.hits:rainState.score,target=sub==='A'?mc.targetPackets:mc.targetScore,pct=Math.max(0,Math.min(100,Math.round(cur/target*100)));
    $('rainProgressText').textContent=sub==='A'?`已搶 ${cur} / ${target} 包`:`目前 ${cur} / ${target} 分`;
    $('rainPercent').textContent=pct+'%';$('rainProgressBar').style.transform=`scaleX(${pct/100})`;
  }
}
function rainSpawnRate(){return {normal:520,high:320,max:210}[rainCfg().density]||320;}
function rainDuration(){const a={normal:[3.0,4.2],fast:[2.2,3.1],turbo:[1.8,2.5],ultra:[1.5,2.1]}[rainCfg().speed]||[2.2,3.1];return a[0]+Math.random()*(a[1]-a[0]);}
function scoreValue(){
  const r=rainCfg(),mc=r.C||{},d=mc.difficulty||'normal',rate=d==='easy'?.09:d==='hard'?.19:.14;
  if(Math.random()<rate){
    let arr=d==='easy'?[-1,-2,-3]:d==='hard'?[-2,-5,-8]:[-1,-3,-5];
    const scale=mc.targetScore<=30?.7:mc.targetScore>=100?1.25:1;
    return -Math.max(1,Math.round(Math.abs(arr[Math.floor(Math.random()*arr.length)])*scale));
  }
  const values=[1,2,5,10],weights=[.20,.38,.30,.12],x=Math.random();let acc=0;
  for(let i=0;i<values.length;i++){acc+=weights[i];if(x<=acc)return values[i];}
  return 2;
}
function bombRate(){
  const d=(rainCfg().C||{}).difficulty||'normal';
  return d==='easy'?.02:d==='hard'?.06:.04;
}
function rainPacketCap(){
  const mobile=matchMedia('(max-width:700px)').matches,d=rainCfg().density;
  return mobile?({normal:8,high:11,max:14}[d]||11):({normal:12,high:18,max:24}[d]||18);
}
function spawnRainPacket(){
  if(!rainState.playing||!$('rainArena'))return;
  const arena=$('rainArena');
  if(arena.querySelectorAll('.falling-redpacket').length>=rainPacketCap())return;
  const sub=rainCfg().subMode,b=document.createElement('button');
  const isBomb=sub==='C'&&Math.random()<bombRate();
  let score=sub==='C'&&!isBomb?scoreValue():null;
  let kind=isBomb?'bomb':sub==='C'?(score<0?'penalty':score>=10?'bonus':'normal'):(Math.random()<.13?'gold':'normal');
  b.type='button';b.className=`falling-redpacket ${kind}`;
  b.innerHTML=isBomb?'<i><span>💣</span></i>':'<i><span>福</span></i>';
  b.dataset.score=score===null?'':String(score);
  b.dataset.effect=isBomb?'reset':'';
  b.style.left=(10+Math.random()*78)+'%';
  const amp=(38+Math.random()*58)*(Math.random()<.5?-1:1);
  b.style.setProperty('--x1',amp+'px');
  b.style.setProperty('--x2',(-amp*.70)+'px');
  b.style.setProperty('--x3',(amp*.88)+'px');
  b.style.setProperty('--x4',(-amp*.28)+'px');
  b.style.setProperty('--r0',(Math.random()*16-8)+'deg');
  b.style.setProperty('--r1',(Math.random()*38-19)+'deg');
  b.style.setProperty('--r2',(Math.random()*38-19)+'deg');
  b.style.setProperty('--r3',(Math.random()*38-19)+'deg');
  b.style.setProperty('--r4',(Math.random()*56-28)+'deg');
  const dur=rainDuration();b.style.animationDuration=dur+'s';
  arena.appendChild(b);
  const cleanup=()=>{if(b.isConnected)b.remove();};
  b.addEventListener('animationend',cleanup,{once:true});
  setTimeout(cleanup,dur*1000+350);
}
function showFloat(x,y,text,neg=false){const a=$('rainArena');if(!a)return;const isBomb=String(text).includes('💥');const f=document.createElement('div');f.className='rain-float-score '+(isBomb?'bomb':neg?'negative':'positive')+(String(text).length>4?' long':'');f.textContent=text;const r=a.getBoundingClientRect();f.style.left=(x-r.left)+'px';f.style.top=(y-r.top)+'px';a.appendChild(f);setTimeout(()=>f.remove(),900);}
function tapRainPacket(e,b,score){
  e.preventDefault();if(!rainState.playing||rainState.requesting||b.classList.contains('tapped'))return;b.classList.add('tapped');
  if(navigator.vibrate)navigator.vibrate(12);if(rainCfg().sound!==false)popSound();
  const sub=rainCfg().subMode;
  if(sub==='A'){
    rainState.hits++;showFloat(e.clientX,e.clientY,`已搶 ${rainState.hits}/${rainModeCfg().targetPackets} 包`);updateRainHud();setTimeout(()=>b.remove(),110);
    if(rainState.hits>=rainModeCfg().targetPackets)qualifyRain();
  }else if(sub==='C'){
    if(b.dataset.effect==='reset'){
      rainState.score=0;
      if(navigator.vibrate)navigator.vibrate([25,35,25]);
      showFloat(e.clientX,e.clientY,'💥 分數歸零！',true);
    }else{
      rainState.score=Math.max(0,rainState.score+score);
      showFloat(e.clientX,e.clientY,`目前 ${rainState.score}/${rainModeCfg().targetScore} 分`,score<0);
    }
    updateRainHud();setTimeout(()=>b.remove(),110);
    if(rainState.score>=rainModeCfg().targetScore)qualifyRain();
  }else{
    rainState.hits++;showFloat(e.clientX,e.clientY,`已點 ${rainState.hits}/${rainState.packetLimit} 包`);updateRainHud();
    if((rainPlayer?.wins||0)>=rainCfg().maxWins)finishRainNoDraw('已完成本局挑戰');else drawRainB(b);
  }
}
function beginRain(){
  rainState.playing=true;rainState.spawnTimer=setInterval(spawnRainPacket,rainSpawnRate());
  const burst=rainCfg().density==='max'?8:rainCfg().density==='high'?5:3;for(let i=0;i<burst;i++)setTimeout(spawnRainPacket,i*80);
  rainState.clockTimer=setInterval(()=>{if(!rainState.playing&&!rainState.requesting)return;rainState.timeLeft--;updateRainHud();if(rainState.timeLeft<=0)rainTimeout();},1000);
}
function stopRainPacketsOnly(){clearInterval(rainState.spawnTimer);rainState.spawnTimer=null;document.querySelectorAll('.falling-redpacket').forEach(x=>x.remove());}
function stopRainAll(markPlaying=false){clearInterval(rainState.spawnTimer);clearInterval(rainState.clockTimer);rainState.spawnTimer=rainState.clockTimer=null;rainState.playing=markPlaying;document.querySelectorAll('.falling-redpacket').forEach(x=>x.remove());}
async function finishRainNoDraw(message='挑戰完成'){
  removeRainQualifiedOverlay();stopRainAll(false);rainState.qualified=false;rainState.requesting=false;
  try{
    const j=await fetch('/api/rooms/'+roomId+'/rain/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player,deviceId,playId:rainState.playId})}).then(r=>r.json());
    if(j.ok){room=j.room;rainPlayer=j.player;}
  }catch(e){}
  const r=rainCfg(),mc=rainModeCfg(),plays=rainPlayer?.plays||0,remaining=Math.max(0,mc.maxPlays-plays);
  const action=remaining>0?`<button class="btn primary rain-again-btn" onclick="renderRainHome()">▶ 再挑戰一次（剩 ${remaining} 次）</button>`:`<div class="rain-done-note">本次活動可玩次數已用完（共 ${mc.maxPlays} 次）。</div>`;
  $('area').innerHTML=`<div class="rain-end-card complete"><div class="rain-end-icon">✅</div><h2>${escapeHtml(message)}</h2><p>本場最多開獎 ${r.maxWins} 次已使用完；「再接再厲」也算一次正式抽獎結果。</p>${action}</div>`;
}
function removeRainQualifiedOverlay(){
  const x=document.getElementById('rainQualifiedOverlay');
  if(x)x.remove();
}
function qualifyRain(){
  if(rainState.qualified)return;rainState.qualified=true;stopRainAll(false);
  if((rainPlayer?.wins||0)>=rainCfg().maxWins)return finishRainNoDraw('已達標！');
  removeRainQualifiedOverlay();
  document.body.insertAdjacentHTML('beforeend',`<div id="rainQualifiedOverlay" class="rain-qualified-overlay"><div class="rain-qualified"><div class="rq-icon">🎉</div><h2>已達標！</h2><p>${rainCfg().subMode==='A'?`已搶滿 ${rainState.hits} 包`:`目前 ${rainState.score} 分`}</p><div id="rainReel" class="rain-reel">準備開獎</div><button id="rainDrawBtn" class="btn rain-draw-btn" onclick="drawQualifiedRain()">🎁 立即抽獎</button></div></div>`);
}
async function rainDrawRequest(drawKey){
  return fetch('/api/rooms/'+roomId+'/rain/draw',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player,deviceId,playId:rainState.playId,drawKey,hits:rainState.hits,score:rainState.score})}).then(r=>r.json());
}
async function drawQualifiedRain(){
  if(rainState.drawing)return;rainState.drawing=true;const btn=$('rainDrawBtn');if(btn){btn.disabled=true;btn.textContent='開獎中…';}
  let j;
  try{j=await rainDrawRequest('qualified-main');}catch(e){rainState.drawing=false;if(btn){btn.disabled=false;btn.textContent='🎁 立即抽獎';}return alert('開獎連線失敗，請再試一次');}
  if(!j.ok){rainState.drawing=false;if(btn){btn.disabled=false;btn.textContent='🎁 立即抽獎';}return alert(j.message||'開獎失敗');}
  room=j.room;rainPlayer=j.player;
  if(j.noDraw||!j.result){rainState.drawing=false;return finishRainNoDraw('已達標！');}
  lastResult=j.result;
  const reel=$('rainReel'),names=[...new Set([...(room.prizes||[]).map(p=>p.name),j.result.prize])];let delay=45;
  for(let i=0;i<29;i++){if(reel)reel.textContent=names[Math.floor(Math.random()*names.length)]||'再接再厲';await new Promise(r=>setTimeout(r,delay));if(i>16)delay+=9;if(i>23)delay+=18;}
  if(reel)reel.textContent=j.result.prize;
  if(isLoseResult(j.result))loseSound();else{winSound();sparkRain();}
  setTimeout(()=>{removeRainQualifiedOverlay();showResultModal(j.result);renderRainComplete(j.result);rainState.drawing=false;},550);
}
function sparkRain(){const arena=$('rainArena');if(!arena)return;for(let i=0;i<24;i++){const s=document.createElement('span');s.className='rain-spark';s.textContent=i%3?'✦':'★';s.style.left=(45+Math.random()*10)+'%';s.style.top=(40+Math.random()*15)+'%';s.style.setProperty('--sx',(Math.random()*260-130)+'px');s.style.setProperty('--sy',(Math.random()*220-110)+'px');arena.appendChild(s);setTimeout(()=>s.remove(),950);}}
async function drawRainB(){
  if(rainState.requesting)return;rainState.requesting=true;stopRainPacketsOnly();
  let j;try{j=await rainDrawRequest('packet-'+rainState.hits);}catch(e){rainState.requesting=false;return rainTimeout('開獎連線失敗');}
  if(!j.ok){rainState.requesting=false;return rainTimeout(j.message||'開獎失敗');}
  room=j.room;rainPlayer=j.player;
  if(j.noDraw||!j.result){rainState.requesting=false;return finishRainNoDraw('已完成本局挑戰');}
  lastResult=j.result;if(isLoseResult(j.result))loseSound();else winSound();
  if(j.finished){stopRainAll(false);showResultModal(j.result);renderRainComplete(j.result);rainState.requesting=false;return;}
  const arena=$('rainArena');if(arena){const t=document.createElement('div');t.className='rain-mini-result '+(isLoseResult(j.result)?'lose':'win');t.textContent=(isLoseResult(j.result)?'🧧 ':'🎉 ')+j.result.prize+`（${rainState.hits}/${rainState.packetLimit}）`;arena.appendChild(t);setTimeout(()=>t.remove(),950);}
  rainState.requesting=false;if(rainState.timeLeft>0&&rainState.hits<rainState.packetLimit){rainState.playing=true;rainState.spawnTimer=setInterval(spawnRainPacket,rainSpawnRate());for(let i=0;i<4;i++)setTimeout(spawnRainPacket,i*80);}
}
async function rainTimeout(custom=''){
  removeRainQualifiedOverlay();if(!rainState.playId)return;stopRainAll(false);rainState.requesting=false;
  try{const j=await fetch('/api/rooms/'+roomId+'/rain/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player,deviceId,playId:rainState.playId})}).then(r=>r.json());if(j.ok){room=j.room;rainPlayer=j.player;}}catch(e){}
  $('area').innerHTML=`<div class="rain-end-card"><div class="rain-end-icon">⏰</div><h2>${custom?'本局結束':'時間到！'}</h2><p>${escapeHtml(custom||(rainCfg().subMode==='C'?`最後分數 ${rainState.score}`:`這次搶到 ${rainState.hits} 包`))}</p><button class="btn primary" onclick="renderRainHome()">再挑戰一次</button></div>`;
}
function renderRainComplete(result){
  removeRainQualifiedOverlay();stopRainAll(false);rainState.qualified=false;
  const lose=isLoseResult(result),r=rainCfg(),mc=rainModeCfg(),plays=rainPlayer?.plays||0,remaining=Math.max(0,mc.maxPlays-plays);
  const title=lose?'本次結果：再接再厲':'恭喜完成開獎！';
  const msg=lose?'本次抽獎結果為「再接再厲」，已使用 1 次開獎名額。':`抽中：${escapeHtml(result.prize)}（已使用 1 次開獎名額）`;
  const action=remaining>0?`<button class="btn primary rain-again-btn" onclick="renderRainHome()">▶ 再挑戰一次（剩 ${remaining} 次）</button>`:`<div class="rain-done-note">本次活動可玩次數已用完（共 ${mc.maxPlays} 次）。</div>`;
  $('area').innerHTML=`<div class="rain-end-card complete"><div class="rain-end-icon">${lose?'🧧':'🎉'}</div><h2>${title}</h2><p>${msg}</p>${action}</div>`;
}
</script>
</body>
</html>
