<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>抽獎主控登入</title></head><body class="login-body">
<div class="login card"><div class="bigicon">🎪</div><h1 style="text-align:center">歡樂抽獎主控</h1><p class="muted" style="text-align:center">請輸入主控密碼</p><input id="pw" class="input" type="password" placeholder="主控密碼"><button class="btn primary" style="width:100%;margin-top:12px" onclick="login()">進入主控</button><p id="msg" style="color:#d64d6d;text-align:center"></p></div>
<script>async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})}).then(x=>x.json());if(r.ok){sessionStorage.admin='1';location='admin.html'}else msg.textContent='主控密碼錯誤';}pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()})</script></body></html>
